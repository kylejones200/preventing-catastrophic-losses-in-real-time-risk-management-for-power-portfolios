[project]
name = "preventing-catastrophic-losses-in-real-time-risk-management-for-power-portfolios"
version = "0.1.0"
description = "Companion code for Medium article: preventing catastrophic losses in real time risk management for power portfolios"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "pytest>=8.0",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

# Optional Rust extension — build with:
#   pip install maturin && maturin develop --release -m rust/py/Cargo.toml
[tool.maturin]
manifest-path = "rust/py/Cargo.toml"
module-name = "preventing_catastrophic_losses_in_real_time_risk_management_for_power_portfolios_rs"

